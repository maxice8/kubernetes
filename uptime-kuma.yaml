---
kind: Namespace
apiVersion: v1
metadata:
  name: kuma
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: uptime-kuma
  namespace: kuma
spec:
  replicas: 1
  serviceName: uptime-kuma-service
  selector:
    matchLabels:
      app: uptime-kuma
  template:
    metadata:
      labels:
        app: uptime-kuma
    spec:
      containers:
        - name: uptime-kuma
          image: louislam/uptime-kuma:1
          env:
            - name: UPTIME_KUMA_PORT
              value: "3001"
            - name: PORT
              value: "3001"
          ports:
            - name: uptime-kuma
              containerPort: 3001
              protocol: TCP
          volumeMounts:
            - name: kuma-data
              mountPath: /app/data
      volumes:
        - name: kuma-data
          persistentVolumeClaim:
            claimName: uptime-kuma-data
---
# Service that exposes the uptime-kuma UI over a tailscale service
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma-ui
  namespace: kuma
spec:
  selector:
    app: uptime-kuma
  ports:
    - name: https
      port: 3001
      targetPort: 3001
---
# Ingress for uptime-kuma
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uptime-kuma-tls-ingress
  namespace: kuma
spec:
  defaultBackend:
    service:
      name: uptime-kuma-ui
      port:
        number: 3001
  ingressClassName: tailscale
  tls:
    - hosts:
        - uptime
---
# Volume used by uptime-kuma to store data, mounted on /app/data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uptime-kuma-data
  namespace: kuma
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
